<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Colors Find</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#efe6d6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Colors Find">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lobster&display=swap">
<style>
:root{--bg:#efe6d6;--ink:#2a1a12;--mut:#6b5b4d;--card:#f8f2e6;--line:#cfc0a6;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:12px 14px}
.top{display:flex;align-items:center;gap:12px;padding:4px 2px 8px}
.top img{height:58px;width:auto;flex:none}
.top h1{font-size:1.7rem;line-height:1.1;margin:0;font-weight:700;letter-spacing:.01em}
.top small{display:block;font-size:.95rem;font-weight:500;color:var(--mut);margin-top:2px}
.brand{font-family:Lobster,"Brush Script MT",cursive;font-weight:400;color:#a05820;font-size:1.25em;letter-spacing:.01em}
#splash{position:fixed;inset:0;z-index:50;background:#f4ead9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .5s ease,visibility .5s;padding:24px;text-align:center}
#splash.off{opacity:0;visibility:hidden}
#splash img{width:min(72vw,340px);height:auto;animation:pop .7s ease-out both}
#splash h2{margin:6px 0 0;font-size:1.8rem;font-weight:700;color:#2a1a12}
#splash p{margin:0;font-size:1.05rem;color:#6b5b4d}
#splash .brand{font-size:1.6em}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.hero{min-height:30vh;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.hero b{font-size:2.4rem;font-weight:650;letter-spacing:.02em}
.hero span{font-size:.95rem}
.hero.small{min-height:110px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center}
.btn{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:10px;font:inherit;font-weight:600;min-height:44px;cursor:pointer}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:disabled{opacity:.4}
.btn.warn{color:#8a2222}
input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
input:not([type=color]):not([type=radio]):not([type=file]),select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:44px;color:var(--ink);width:100%}
#hex{width:8rem}
.ctl select{flex:1;width:auto}
h2{font-size:1rem;margin:22px 0 8px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.sw{position:relative}
.chip{width:100%;height:92px;border:0;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:8px;font:inherit;text-align:left;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);cursor:pointer}
.chip span{font-size:.75rem;font-weight:650}
.chip b{font-size:.8rem;font-weight:500}
.plus{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#222;font-size:1.3rem;line-height:1;cursor:pointer}
.mt{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--mut);margin-top:4px}
.mt i{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;font:inherit;font-weight:600;padding:16px 4px;color:var(--mut);cursor:pointer}
nav button[aria-current=true]{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
.form{display:grid;gap:10px;margin:12px 0}
.form label{display:grid;gap:4px;font-size:.85rem;color:var(--mut)}
.line{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.line div{flex:1;min-width:0}
.dot{width:44px;height:44px;border-radius:50%;border:0;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);cursor:pointer}
.line input{margin-top:4px;min-height:38px;padding:6px 10px}
.x{border:0;background:none;font-size:1.1rem;padding:12px;cursor:pointer;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
dialog{border:0;border-radius:14px;padding:12px;width:min(94vw,560px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
canvas{width:auto;max-width:100%;max-height:52vh;display:block;margin:8px auto;border-radius:8px;touch-action:manipulation}
.dh{display:flex;align-items:center;gap:10px;justify-content:space-between}
.pv{width:32px;height:32px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
#phex{flex:1}
.seg{display:flex;gap:16px;margin:6px 0}
.hint,.empty{color:var(--mut);font-size:.9rem}
footer{color:var(--mut);font-size:.75rem;margin:28px 0 0}
:focus-visible{outline:3px solid #1d6ee0;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.toast,#splash{transition:none}#splash img{animation:none}}
</style>
</head>
<body>
<div id="splash" role="img" aria-label="Colors Find by coffee-time"><img src="logo.png" alt=""><h2>Colors Find</h2><p>by <span class="brand">coffee-time</span></p></div>
<main><header class="top"><img src="logo.png" alt="Logo Coffee Time"><div><h1>Colors Find</h1><small>by <span class="brand">coffee-time</span></small></div></header><div id="app"></div>
<footer>Outil de fan non officiel, sans lien avec Games Workshop. Les couleurs sont calculées, aucun nom de peinture du commerce n’est intégré.</footer></main>
<nav>
<button data-v="couleur">Couleur</button>
<button data-v="nuancier">Nuancier</button>
<button data-v="peintures">Mes peintures</button>
</nav>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<dialog id="dlg">
<div class="dh"><b>Prendre la couleur sur la photo</b><button class="x" id="dx" aria-label="Fermer">✕</button></div>
<canvas id="cv"></canvas>
<div class="seg">
<label><input type="radio" name="m" value="c" checked> Peinture</label>
<label><input type="radio" name="m" value="w"> Blanc de référence</label>
</div>
<div class="dh"><span class="pv" id="pv"></span><span id="phex">Touche l’image</span><button class="btn pri" id="use" disabled>Utiliser</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const KEY="nuancier-v1";

/* ---------- Données ---------- */
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.palettes)&&d.palettes.length)return d}catch(e){}
  const id=uid();
  return{base:"#7a2e2e",palettes:[{id,name:"Mon premier nuancier",cat:"",colors:[]}],cur:id,paints:[]};
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const cur=()=>S.palettes.find(p=>p.id===S.cur)||(S.cur=S.palettes[0].id,S.palettes[0]);
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)}

/* ---------- Couleurs (OKLab / OKLCH) ---------- */
const h2r=h=>{h=h.replace("#","");return[0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const r2h=a=>"#"+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
const lin=c=>(c/=255)<=.04045?c/12.92:((c+.055)/1.055)**2.4;
const gam=c=>{c=Math.max(0,Math.min(1,c));return 255*(c<=.0031308?12.92*c:1.055*c**(1/2.4)-.055)};
function lab(hex){
  const[r,g,b]=h2r(hex).map(lin);
  const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),
        m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),
        s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);
  return[.2104542553*l+.793617785*m-.0040720468*s,1.9779984951*l-2.428592205*m+.4505937099*s,.0259040371*l+.7827717662*m-.808675766*s];
}
function unlab(L,a,b){
  const l=(L+.3963377774*a+.2158037573*b)**3,m=(L-.1055613458*a-.0638541728*b)**3,s=(L-.0894841775*a-1.291485548*b)**3;
  return[4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s];
}
function lch(hex){const[L,a,b]=lab(hex);return[L,Math.hypot(a,b),Math.atan2(b,a)*180/Math.PI]}
function fromLch(L,C,h){
  let rgb;
  for(let i=0;i<30;i++){
    const t=h*Math.PI/180;
    rgb=unlab(L,C*Math.cos(t),C*Math.sin(t));
    if(rgb.every(v=>v>-.0005&&v<1.0005))break;
    C*=.93;
  }
  return r2h(rgb.map(gam));
}
const ink=hex=>lab(hex)[0]>.62?"#1b1b1b":"#ffffff";

function harmonies(hex){
  const[L,C,h]=lch(hex);
  const mk=(l,c,hh)=>fromLch(Math.max(.06,Math.min(.97,l)),c,((hh%360)+360)%360);
  // Ombres : teinte poussée vers le froid. Lumières : poussée vers le chaud.
  const sh=(hh,t,amt)=>{const d=((t-hh+540)%360)-180;return hh+Math.sign(d)*Math.min(Math.abs(d),amt)};
  const hc=h+180;
  return{
    ramp:[["Ombre profonde",mk(L-.26,C*.85,sh(h,270,14))],["Ombre",mk(L-.13,C*.95,sh(h,270,7))],["Base",hex],["Lumière",mk(L+.11,C*.95,sh(h,90,7))],["Haute lumière",mk(L+.22,C*.7,sh(h,90,14))]],
    comp:[["Compl. sombre",mk(L-.13,C,hc)],["Complémentaire",mk(L,C,hc)],["Compl. claire",mk(L+.13,C,hc)]],
    split:[["Partagée −30°",mk(L,C,h+150)],["Partagée +30°",mk(L,C,h+210)]],
    ana:[["Analogue −30°",mk(L,C,h-30)],["Analogue +30°",mk(L,C,h+30)]],
    tri:[["Triade +120°",mk(L,C,h+120)],["Triade +240°",mk(L,C,h+240)]]
  };
}
function nearN(hex,n){
  const x=lab(hex);
  return S.paints.map(p=>{const y=lab(p.hex);return{p,d:Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])}}).sort((a,b)=>a.d-b.d).slice(0,n);
}
const near=hex=>{const r=nearN(hex,1)[0];return r?r.p:null};
const closeness=d=>d<.03?"très proche":d<.07?"proche":d<.12?"approximative":"éloignée";

/* ---------- Vues ---------- */
let view="couleur";
let D={hex:S.base,brand:"",name:""};
let photoTarget="base";
function sw([label,hex]){
  const r=nearN(hex,1)[0],n=r&&r.p;
  return`<div class="sw"><button class="chip" data-act="use" data-hex="${hex}" style="background:${hex};color:${ink(hex)}"><span>${esc(label)}</span><b>${hex}</b></button><button class="plus" data-act="add" data-hex="${hex}" data-role="${esc(label)}" aria-label="Ajouter ${hex} au nuancier">+</button>${n?`<small class="mt"><i style="background:${n.hex}"></i>${esc(n.name)}${r.d>.07?" (approx.)":""}</small>`:""}</div>`;
}
const sec=(t,a)=>`<h2>${t}</h2><div class="row">${a.map(sw).join("")}</div>`;

function vCouleur(){
  const b=S.base,H=harmonies(b),n=near(b);
  return`<section class="hero" style="background:${b};color:${ink(b)}"><b>${b}</b><span>${n?"Proche de : "+esc((n.brand?n.brand+" ":"")+n.name):"Couleur de base"}</span></section>
  <div class="ctl"><label class="btn">Choisir<input type="color" id="pick" value="${b}"></label><input id="hex" value="${b}" maxlength="7" aria-label="Code couleur" autocapitalize="off" spellcheck="false"><button class="btn" data-act="photo" data-target="base">Photo</button></div>
  <div class="ctl"><button class="btn pri" data-act="add" data-hex="${b}" data-role="Base">Ajouter la base au nuancier</button></div>`
  +sec("Ombres et lumières",H.ramp)+sec("Complémentaire",H.comp)+sec("Complémentaire partagée",H.split)+sec("Analogues",H.ana)+sec("Triade",H.tri);
}
const CATS=["Peau","Armure","Métal","Tissu","Cuir","Végétation","Lumière","Socle","Autre"];
function vNuancier(){
  const p=cur();
  return`<div class="ctl"><select id="sel" aria-label="Nuancier actif">${S.palettes.map(q=>`<option value="${q.id}"${q.id===p.id?" selected":""}>${esc(q.name)}${q.cat?" ("+esc(q.cat)+")":""}</option>`).join("")}</select><button class="btn" data-act="newp">Nouveau</button></div>
  <div class="form"><label>Nom<input id="pn" value="${esc(p.name)}"></label><label>Catégorie<input id="pc" list="cats" value="${esc(p.cat)}" placeholder="Armure, peau, métal…"></label><datalist id="cats">${CATS.map(c=>`<option value="${c}">`).join("")}</datalist></div>
  ${p.colors.length?p.colors.map((c,i)=>`<div class="line"><button class="dot" data-act="use" data-hex="${c.hex}" style="background:${c.hex}" aria-label="Utiliser ${c.hex} comme base"></button><div><b>${c.hex}</b><input class="role" data-i="${i}" value="${esc(c.role)}" aria-label="Rôle de la couleur" placeholder="Rôle"></div><button class="x" data-act="del" data-i="${i}" aria-label="Retirer ${c.hex}">✕</button></div>`).join(""):`<p class="empty">Ce nuancier est vide. Choisis une couleur, puis touche « + » sur une nuance pour l’ajouter.</p>`}
  <div class="ctl"><button class="btn" data-act="export">Exporter</button><label class="btn">Importer<input type="file" id="imp" accept=".json,application/json" hidden></label><button class="btn warn" data-act="delp">Supprimer ce nuancier</button></div>`;
}
function vPeintures(){
  const c=D.hex,close=nearN(c,3);
  const item=(p,extra,del)=>`<div class="line"><span class="dot" style="background:${p.hex}"></span><div><b>${esc(p.name)}</b><br><small class="hint">${esc(p.brand||"Sans marque")} – ${p.hex}${extra}</small></div>${del}</div>`;
  return`<p class="hint">Prends la couleur d’un pot en photo, ou choisis-la à la main, donne-lui ton propre nom et ajoute-la à ta collection. L’appli te dit toujours quelle peinture de ta collection s’en rapproche le plus.</p>
  <section class="hero small" style="background:${c};color:${ink(c)}"><b>${c}</b><span>Couleur à ajouter ou à chercher</span></section>
  <div class="ctl"><button class="btn pri" data-act="photo" data-target="paint">Photo du pot</button><label class="btn">Choisir<input type="color" id="pcol" value="${c}"></label><button class="btn" data-act="frombase">Prendre la base</button></div>
  <div class="form"><label>Marque<input id="pb" value="${esc(D.brand)}" placeholder="facultatif"></label><label>Nom<input id="pnm" value="${esc(D.name)}" placeholder="Rouge sombre"></label><button class="btn pri" data-act="addpaint">Ajouter à ma collection</button></div>
  <h2>Les plus proches dans ma collection</h2>
  ${close.length?close.map(r=>item(r.p,", "+closeness(r.d),"")).join(""):`<p class="empty">Ta collection est vide. Ajoute une première peinture pour voir les correspondances.</p>`}
  <h2>Ma collection (${S.paints.length})</h2>
  ${S.paints.length?S.paints.map((p,i)=>item(p,"",`<button class="x" data-act="delpaint" data-i="${i}" aria-label="Retirer ${esc(p.name)}">✕</button>`)).join(""):`<p class="empty">Aucune peinture enregistrée pour le moment.</p>`}`;
}
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===view));
  $("#app").innerHTML=view==="couleur"?vCouleur():view==="nuancier"?vNuancier():vPeintures();
}

/* ---------- Actions ---------- */
document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b){view=b.dataset.v;render();scrollTo(0,0)}});
$("#app").addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act,d=t.dataset,p=cur();
  if(a==="use"){S.base=d.hex;view="couleur";save();render();scrollTo(0,0)}
  else if(a==="add"){p.colors.push({hex:d.hex,role:d.role||""});save();toast(`Ajouté à « ${p.name} »`)}
  else if(a==="photo"){photoTarget=d.target||"base";$("#file").click()}
  else if(a==="frombase"){D.hex=S.base;render()}
  else if(a==="del"){p.colors.splice(+d.i,1);save();render()}
  else if(a==="newp"){const id=uid();S.palettes.push({id,name:"Nouveau nuancier",cat:"",colors:[]});S.cur=id;save();render()}
  else if(a==="delp"){
    if(!confirm(`Supprimer le nuancier « ${p.name} » ?`))return;
    S.palettes=S.palettes.filter(q=>q.id!==p.id);
    if(!S.palettes.length)S.palettes.push({id:uid(),name:"Mon premier nuancier",cat:"",colors:[]});
    S.cur=S.palettes[0].id;save();render();
  }
  else if(a==="export"){
    const blob=new Blob([JSON.stringify({palettes:S.palettes,paints:S.paints},null,2)],{type:"application/json"});
    const l=document.createElement("a");l.href=URL.createObjectURL(blob);l.download="nuancier.json";l.click();
    setTimeout(()=>URL.revokeObjectURL(l.href),1000);
  }
  else if(a==="addpaint"){
    D.brand=$("#pb").value.trim();D.name=$("#pnm").value.trim();
    if(!D.name){toast("Donne un nom à la peinture");return}
    S.paints.push({brand:D.brand,name:D.name,hex:D.hex});D.name="";save();render();toast("Peinture ajoutée");
  }
  else if(a==="delpaint"){S.paints.splice(+d.i,1);save();render()}
});
$("#app").addEventListener("change",e=>{
  const t=e.target,p=cur();
  if(t.id==="pcol"){D.brand=$("#pb").value;D.name=$("#pnm").value;D.hex=t.value.toLowerCase();render()}
  else if(t.id==="pick"||t.id==="hex"){
    let v=t.value.trim().toLowerCase();if(/^[0-9a-f]{6}$/.test(v))v="#"+v;
    if(/^#[0-9a-f]{6}$/.test(v)){S.base=v;save();render()}else toast("Code invalide. Format attendu : #a1b2c3");
  }
  else if(t.id==="sel"){S.cur=t.value;save();render()}
  else if(t.id==="pn"){p.name=t.value.trim()||"Sans nom";save();render()}
  else if(t.id==="pc"){p.cat=t.value.trim();save();render()}
  else if(t.classList.contains("role")){p.colors[+t.dataset.i].role=t.value;save()}
  else if(t.id==="imp"&&t.files[0]){
    t.files[0].text().then(txt=>{
      try{
        const d=JSON.parse(txt);let n=0;
        (d.palettes||[]).forEach(q=>{if(q&&Array.isArray(q.colors)){S.palettes.push({id:uid(),name:String(q.name||"Importé"),cat:String(q.cat||""),colors:q.colors.filter(c=>/^#[0-9a-f]{6}$/i.test(c.hex)).map(c=>({hex:c.hex.toLowerCase(),role:String(c.role||"")}))});n++}});
        (d.paints||[]).forEach(q=>{if(q&&/^#[0-9a-f]{6}$/i.test(q.hex)&&!S.paints.some(x=>x.hex===q.hex.toLowerCase()&&x.name===q.name))S.paints.push({brand:String(q.brand||""),name:String(q.name||"Sans nom"),hex:q.hex.toLowerCase()})});
        save();render();toast(`${n} nuancier(s) importé(s)`);
      }catch(err){toast("Fichier illisible")}
    });
  }
});

$("#app").addEventListener("input",e=>{if(e.target.id==="pb")D.brand=e.target.value;if(e.target.id==="pnm")D.name=e.target.value});

/* ---------- Photo ---------- */
const cv=$("#cv"),cx=cv.getContext("2d",{willReadFrequently:true}),dlg=$("#dlg");
let img=null,gain=[1,1,1],pick=null;
$("#file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const bmp=await createImageBitmap(f),k=Math.min(1,900/Math.max(bmp.width,bmp.height));
    cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
    cx.drawImage(bmp,0,0,cv.width,cv.height);
    img=cx.getImageData(0,0,cv.width,cv.height);
    gain=[1,1,1];pick=null;$("#use").disabled=true;$("#phex").textContent="Touche l’image";$("#pv").style.background="none";
    document.querySelector("input[name=m][value=c]").checked=true;
    dlg.showModal();
  }catch(err){toast("Image illisible")}
  e.target.value="";
};
cv.onclick=e=>{
  if(!img)return;
  const r=cv.getBoundingClientRect(),x=Math.round((e.clientX-r.left)*cv.width/r.width),y=Math.round((e.clientY-r.top)*cv.height/r.height),R=6;
  const x0=Math.max(0,x-R),y0=Math.max(0,y-R),x1=Math.min(cv.width,x+R+1),y1=Math.min(cv.height,y+R+1);
  let s=[0,0,0],n=0;
  for(let j=y0;j<y1;j++)for(let i=x0;i<x1;i++){const o=(j*cv.width+i)*4;s[0]+=img.data[o];s[1]+=img.data[o+1];s[2]+=img.data[o+2];n++}
  s=s.map(v=>v/n);
  if(document.querySelector("input[name=m]:checked").value==="w"){
    const g=(s[0]+s[1]+s[2])/3;gain=s.map(v=>g/Math.max(v,1));
    $("#phex").textContent="Blanc réglé. Touche maintenant la peinture.";
    document.querySelector("input[name=m][value=c]").checked=true;
  }else{
    pick=r2h(s.map((v,i)=>v*gain[i]));$("#pv").style.background=pick;$("#phex").textContent=pick;$("#use").disabled=false;
  }
  cx.putImageData(img,0,0);
  cx.strokeStyle="#fff";cx.lineWidth=3;cx.beginPath();cx.arc(x,y,R+4,0,7);cx.stroke();
  cx.strokeStyle="#000";cx.lineWidth=1;cx.beginPath();cx.arc(x,y,R+6,0,7);cx.stroke();
};
$("#dx").onclick=()=>dlg.close();
$("#use").onclick=()=>{
  if(!pick)return;
  if(photoTarget==="paint"){D.hex=pick;view="peintures"}else{S.base=pick;save();view="couleur"}
  dlg.close();render();scrollTo(0,0);
};

/* ---------- Démarrage ---------- */
(()=>{const sp=$("#splash");let done=false;const hide=()=>{if(done)return;done=true;sp.classList.add("off");setTimeout(()=>sp.remove(),600)};
sp.addEventListener("click",hide);setTimeout(hide,matchMedia("(prefers-reduced-motion:reduce)").matches?600:1800)})();
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
